name: UE 5.4 build and theater bake
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate descriptor and editor script
        run: |
          python3 -m json.tool ZeroZoneUE5.uproject >/dev/null
          python3 -m py_compile Scripts/build_theaters.py
          test -f Source/ZeroZoneUE5.Target.cs
          test -f Source/ZeroZoneUE5Editor.Target.cs
  engine:
    name: UHT, Editor and Game builds, partitioned map bake
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, ue-5.4]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - name: Compile reflected headers and link both targets
        shell: bash
        run: |
          set -euo pipefail
          : "${UE_ROOT:?Set UE_ROOT to the licensed UE 5.4 installation on the runner}"
          python3 - "$UE_ROOT/Engine/Build/Build.version" <<'PY'
          import json, sys
          v = json.load(open(sys.argv[1]))
          assert (v['MajorVersion'], v['MinorVersion']) == (5, 4), v
          PY
          build="$UE_ROOT/Engine/Build/BatchFiles/Linux/Build.sh"
          for target in ZeroZoneUE5Editor ZeroZoneUE5; do
            bash "$build" "$target" Linux Development -Project="$PWD/ZeroZoneUE5.uproject" -WaitMutex -NoUnity
          done
      - name: Bake landscapes and check saved level packages
        shell: bash
        run: |
          set -euo pipefail
          "$UE_ROOT/Engine/Binaries/Linux/UnrealEditor-Cmd" "$PWD/ZeroZoneUE5.uproject" -run=pythonscript -script="$PWD/Scripts/build_theaters.py" -unattended -nullrhi -nosound -nop4 -stdout -FullStdOutLogOutput
          for level in AmberCanal ChalkReach; do
            test -s "Content/Theaters/$level.umap"
            test -n "$(find "Content/__ExternalActors__/Theaters/$level" -name '*.uasset' -print -quit)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: partitioned-theaters-${{ github.sha }}
          path: Content/
          if-no-files-found: error
