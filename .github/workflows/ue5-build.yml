name: UE 5.4 hosted validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_native_ue_build:
        description: Run UHT, native builds, and bake partitioned theater maps on the licensed UE runner
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  hosted-validation:
    name: Clang, Python, YAML and shell validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Clang tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-format ruby
      - name: Validate C++ source syntax, headers, and AST probe
        run: python3 Scripts/validate_cpp_sources.py
      - name: Verify theater generator contract
        run: |
          python3 -m py_compile Scripts/build_theaters.py Scripts/validate_theater_generator.py Scripts/validate_cpp_sources.py
          python3 Scripts/validate_theater_generator.py
      - name: Parse workflow YAML and all Bash blocks
        run: ruby Scripts/validate_workflow.rb
  native-ue-build:
    name: Optional UE 5.4 UHT, builds and map bake
    needs: hosted-validation
    if: github.event_name == 'workflow_dispatch' && inputs.run_native_ue_build == true
    runs-on: [self-hosted, linux, x64, ue-5.4]
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - name: Compile reflected headers and link Editor and Game targets
        shell: bash
        run: |
          set -euo pipefail
          : "${UE_ROOT:?Set UE_ROOT to the licensed UE 5.4 installation on this runner}"
          python3 - "$UE_ROOT/Engine/Build/Build.version" <<'PY'
          import json, sys
          version = json.load(open(sys.argv[1], encoding="utf-8"))
          assert (version["MajorVersion"], version["MinorVersion"]) == (5, 4), version
          PY
          build="$UE_ROOT/Engine/Build/BatchFiles/Linux/Build.sh"
          for target in ZeroZoneUE5Editor ZeroZoneUE5; do
            bash "$build" "$target" Linux Development -Project="$PWD/ZeroZoneUE5.uproject" -WaitMutex -NoUnity
          done
      - name: Bake landscapes and verify saved World Partition packages
        shell: bash
        run: |
          set -euo pipefail
          "$UE_ROOT/Engine/Binaries/Linux/UnrealEditor-Cmd" "$PWD/ZeroZoneUE5.uproject" -run=pythonscript -script="$PWD/Scripts/build_theaters.py" -unattended -nullrhi -nosound -nop4 -stdout -FullStdOutLogOutput
          for level in AmberCanal ChalkReach; do
            test -s "Content/Theaters/$level.umap"
            test -n "$(find "Content/__ExternalActors__/Theaters/$level" -name '*.uasset' -print -quit)"
          done
      - name: Upload generated theater content
        uses: actions/upload-artifact@v4
        with:
          name: partitioned-theaters-${{ github.sha }}
          path: Content/
          if-no-files-found: error
